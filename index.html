<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Medical Training Prototype</title>
    <!-- Include A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Include A-Frame Environment Component -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    
    <!-- Custom Logic -->
    <script src="js/interaction.js"></script>
    
    <!-- VR Locomotion Addons -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #000000">
      
      <!-- Lighting -->
      <a-light type="ambient" color="#FFFFFF" intensity="0.7"></a-light>
      <a-light type="point" position="0 3 -2" color="#FFFFFF" intensity="0.5" cast-shadow="true"></a-light>

      <!-- === HOSPITAL STRUCTURE (Built with Code) === -->
      
      <!-- Ground / Floor -->
      <!-- Reception Floor (Wood) -->
      <a-plane position="0 0 2" rotation="-90 0 0" width="10" height="10" color="#C19A6B" shadow="receive: true"></a-plane>
      <!-- Corridor Floor (Grey Tiles) -->
      <a-plane position="0 0 -8" rotation="-90 0 0" width="4" height="10" color="#E0E0E0" shadow="receive: true"></a-plane>
      <!-- Ward Floor (Blueish) -->
      <a-plane position="-7 0 -8" rotation="-90 0 0" width="10" height="10" color="#E3F2FD" shadow="receive: true"></a-plane>

      <!-- Ceiling -->
      <a-plane position="-2 4 -4" rotation="90 0 0" width="24" height="24" color="#FAFAFA"></a-plane>

      <!-- Outer Walls -->
      <!-- Reception Back Wall -->
      <a-plane position="0 2 7" rotation="0 180 0" width="10" height="4" color="#64B5F6"></a-plane>
      <!-- Reception Right Wall -->
      <a-plane position="5 2 2" rotation="0 -90 0" width="10" height="4" color="#64B5F6"></a-plane>
      <!-- Reception Left Wall -->
      <a-plane position="-5 2 2" rotation="0 90 0" width="10" height="4" color="#64B5F6"></a-plane>
      
      <!-- Corridor Right Wall -->
      <a-plane position="2 2 -8" rotation="0 -90 0" width="10" height="4" color="#FFFFFF"></a-plane>
      <!-- Corridor Left Wall (with opening for Ward) -->
      <a-plane position="-2 2 -5.5" rotation="0 90 0" width="5" height="4" color="#FFFFFF"></a-plane>
      <a-plane position="-2 2 -11.5" rotation="0 90 0" width="3" height="4" color="#FFFFFF"></a-plane>
      
      <!-- Corridor End Wall -->
      <a-plane position="0 2 -13" rotation="0 0 0" width="4" height="4" color="#64B5F6"></a-plane>

      <!-- Ward Walls -->
      <a-plane position="-7 2 -3" rotation="0 180 0" width="10" height="4" color="#BBDEFB"></a-plane>
      <a-plane position="-12 2 -8" rotation="0 90 0" width="10" height="4" color="#BBDEFB"></a-plane>
      <a-plane position="-7 2 -13" rotation="0 0 0" width="10" height="4" color="#BBDEFB"></a-plane>


      <!-- === DEPARTMENT: RECEPTION === -->
      <a-entity position="0 0 2">
          <!-- Reception Desk -->
          <a-box position="0 0.5 -2.5" width="4" height="1" depth="1" color="#FAFAFA" shadow="cast: true"></a-box>
          <a-box position="0 1 -2.5" width="4.2" height="0.1" depth="1.2" color="#0D47A1"></a-box>
          <!-- Computer & Keyboard -->
          <a-box position="-1 1.15 -2.5" width="0.6" height="0.4" depth="0.05" color="#212121" rotation="-10 0 0"></a-box>
          <a-box position="-1 1.05 -2.2" width="0.5" height="0.02" depth="0.2" color="#E0E0E0" rotation="0 0 0"></a-box>
          
          <!-- Potted Plant for aesthetics -->
          <a-entity position="3 0 -2.5">
              <a-cylinder position="0 0.3 0" radius="0.3" height="0.6" color="#FFFFFF"></a-cylinder>
              <a-sphere position="0 0.8 0" radius="0.4" color="#2E7D32"></a-sphere>
              <a-sphere position="0.2 1.0 0.1" radius="0.3" color="#388E3C"></a-sphere>
              <a-sphere position="-0.2 0.9 -0.1" radius="0.35" color="#43A047"></a-sphere>
          </a-entity>

          <!-- Waiting Area Chairs -->
          <a-entity position="-3 0 -1" rotation="0 90 0">
              <a-box position="0 0.25 0" width="0.5" height="0.5" depth="0.5" color="#1565C0"></a-box>
              <a-box position="0 0.7 -0.2" width="0.5" height="0.5" depth="0.1" color="#1565C0"></a-box>
              
              <a-box position="0.8 0.25 0" width="0.5" height="0.5" depth="0.5" color="#1565C0"></a-box>
              <a-box position="0.8 0.7 -0.2" width="0.5" height="0.5" depth="0.1" color="#1565C0"></a-box>
          </a-entity>
          
          <!-- Large Wall Clock -->
          <a-cylinder position="0 2.5 4.9" rotation="90 0 0" radius="0.4" height="0.05" color="#212121">
             <a-cylinder position="0 0.05 0" radius="0.35" height="0.02" color="#FAFAFA"></a-cylinder>
             <a-box position="0 0.07 0.1" width="0.02" height="0.02" depth="0.2" color="#000000"></a-box>
             <a-box position="0.1 0.07 0" width="0.2" height="0.02" depth="0.02" color="#000000"></a-box>
          </a-cylinder>

          <!-- Signage -->
          <a-entity position="0 3 -2.5">
             <a-plane width="3" height="0.6" color="#1565C0"></a-plane>
             <a-text value="RECEPTION" font="exo2bold" align="center" position="0 0 0.01" color="#FFFFFF" scale="1.5 1.5 1.5"></a-text>
          </a-entity>
      </a-entity>


      <!-- === DEPARTMENT: WARD (Patient Area) === -->
      <a-entity position="-7 0 -8">
          <!-- Signage -->
          <a-entity position="3 3 0" rotation="0 90 0">
             <a-plane width="2" height="0.5" color="#00695C"></a-plane>
             <a-text value="PATIENT WARD" font="exo2bold" align="center" position="0 0 0.01" color="#FFFFFF"></a-text>
          </a-entity>

          <!-- Patient Bed 1 (Grouped for easier clicking) -->
          <a-entity position="-2 0 2" rotation="0 90 0" patient-interaction class="clickable">
             <a-box position="0 0.4 0" width="1.2" height="0.8" depth="2.5" color="#ECEFF1" shadow="cast: true"></a-box>
             <a-box position="0 0.85 -0.9" width="0.8" height="0.1" depth="0.5" color="#FFFFFF"></a-box>
             <!-- Patient Body (under blanket) -->
             <a-cylinder position="0 0.9 0.1" radius="0.45" height="1.6" rotation="90 0 0" color="#43A047"></a-cylinder>
             <!-- Patient Head -->
             <a-sphere position="0 0.95 -0.9" radius="0.22" color="#FFCCBC"></a-sphere>
             <!-- Patient Arms (resting on top) -->
             <a-cylinder position="-0.4 1.05 0" radius="0.08" height="0.6" rotation="90 0 0" color="#FFCCBC"></a-cylinder>
             <a-cylinder position="0.4 1.05 0" radius="0.08" height="0.6" rotation="90 0 0" color="#FFCCBC"></a-cylinder>
             
             <!-- Monitor -->
             <a-box position="-1.2 0.6 -0.5" width="0.6" height="1.2" depth="0.6" color="#CFD8DC"></a-box>
             <a-plane position="-1.2 1.3 -0.19" width="0.7" height="0.5" color="#000000" rotation="-10 0 0">
                 <a-text value="HR: 72 BPM\nO2: 98%" color="#00FF00" align="left" position="-0.3 0 0.01" scale="0.4 0.4 0.4"></a-text>
             </a-plane>
          </a-entity>
          
          <!-- Professional High-Tech HUD Panel -->
          <a-entity id="feedback-panel" position="-2 2.2 4" rotation="0 180 0">
              <!-- Glass Background -->
              <a-plane width="3.2" height="1.2" color="#1A237E" opacity="0.85" material="shader: flat; transparent: true"></a-plane>
              <!-- Glowing Border (Top/Bottom) -->
              <a-plane position="0 0.6 0.01" width="3.2" height="0.03" color="#00E676" opacity="0.9" material="shader: flat"></a-plane>
              <a-plane position="0 -0.6 0.01" width="3.2" height="0.03" color="#00E676" opacity="0.9" material="shader: flat"></a-plane>
              
              <!-- Header -->
              <a-text value="SYSTEM STATUS & DIAGNOSTICS" font="exo2bold" align="center" position="0 0.45 0.02" color="#00E676" scale="0.8 0.8 0.8"></a-text>
              <a-plane position="0 0.35 0.01" width="3" height="0.01" color="#4FC3F7"></a-plane>
              
              <!-- Main Output Text -->
              <a-text id="feedback-text" value="SYSTEM READY\nSelect an object to interact." 
                      font="kelsonsans" align="center" position="0 -0.05 0.02" color="#FFFFFF" scale="1.2 1.2 1.2"></a-text>
          </a-entity>

         <!-- Medical Equipment Table with Pickup Items -->
         <a-entity id="equipment-table" position="-2.5 0 0" rotation="0 90 0">
            <!-- Table top and leg -->
            <a-box position="0 0.7 0" width="0.8" height="0.05" depth="0.6" color="#FAFAFA" shadow="cast: true"></a-box>
            <a-cylinder position="0 0.35 0" radius="0.05" height="0.7" color="#B0BEC5"></a-cylinder>
            
            <!-- Inspectable Medical Clipboard -->
            <a-entity class="clickable" inspectable="infoText: Patient File - John Doe\nAge: 45 - Status: Stable" position="-0.2 0.75 -0.15" rotation="0 15 0">
                <a-box width="0.3" height="0.02" depth="0.4" color="#8D6E63"></a-box>
                <a-plane position="0 0.015 0" width="0.25" height="0.35" rotation="-90 0 0" color="#FFFFFF"></a-plane>
            </a-entity>
            
            <!-- Inspectable Stethoscope (Tool) -->
            <a-entity class="clickable" inspectable="infoText: Stethoscope\nUsed to check heartbeat and lungs.; isTool: true" position="-0.15 0.8 0.15" rotation="0 -30 0">
                <a-torus position="0 0 0" radius="0.06" radius-tubular="0.005" color="#B0BEC5" arc="180"></a-torus>
                <a-cylinder position="0 -0.1 0" radius="0.005" height="0.2" color="#212121"></a-cylinder>
                <a-cylinder position="0 -0.2 0" radius="0.03" height="0.01" color="#B0BEC5" rotation="90 0 0"></a-cylinder>
            </a-entity>
            
            <!-- Inspectable Syringe -->
            <a-entity class="clickable" inspectable="infoText: 10cc Medical Syringe\nUsed for administering medication." position="0.2 0.75 -0.1" rotation="0 -45 0">
                <a-cylinder position="0 0 0" radius="0.02" height="0.2" color="#FFFFFF" opacity="0.6" rotation="90 0 0"></a-cylinder>
                <a-cylinder position="0 0 -0.12" radius="0.005" height="0.05" color="#9E9E9E" rotation="90 0 0"></a-cylinder>
                <a-cylinder position="0 0 0.1" radius="0.03" height="0.01" color="#42A5F5" rotation="90 0 0"></a-cylinder>
            </a-entity>

            <!-- Inspectable Pill Bottle -->
            <a-entity class="clickable" inspectable="infoText: Amoxicillin 500mg\nAntibiotic for bacterial infections." position="0.2 0.82 0.15">
                <a-cylinder radius="0.05" height="0.15" color="#FF9800"></a-cylinder>
                <a-cylinder position="0 0.08 0" radius="0.05" height="0.02" color="#FFFFFF"></a-cylinder>
            </a-entity>
         </a-entity>
         
         <!-- IV Stand (Drip) with Inspectable IV Bag -->
         <a-entity position="-1.5 0 3.5" rotation="0 180 0">
             <a-cylinder position="0 0.05 0" radius="0.25" height="0.1" color="#424242"></a-cylinder>
             <a-cylinder position="0 1 0" radius="0.03" height="2" color="#E0E0E0"></a-cylinder>
             <a-box position="0 1.9 0.1" width="0.3" height="0.02" depth="0.02" color="#9E9E9E"></a-box>
             
             <!-- IV Bag (Inspectable) -->
             <a-entity class="clickable" inspectable="infoText: Normal Saline (0.9% NaCl)\nIntravenous fluid for hydration." position="0.1 1.7 0.1">
                 <a-cylinder radius="0.08" height="0.25" color="#E3F2FD" opacity="0.8"></a-cylinder>
                 <a-cylinder position="0 -0.4 0" radius="0.005" height="0.6" color="#FFFFFF" opacity="0.5"></a-cylinder>
             </a-entity>
         </a-entity>
         
         <!-- Doctor's Stool -->
         <a-entity position="-1 0 0">
             <a-cylinder position="0 0.05 0" radius="0.2" height="0.1" color="#424242"></a-cylinder>
             <a-cylinder position="0 0.3 0" radius="0.05" height="0.5" color="#B0BEC5"></a-cylinder>
             <a-cylinder position="0 0.5 0" radius="0.22" height="0.1" color="#1565C0"></a-cylinder>
         </a-entity>

      </a-entity>
      
      <!-- Medical Wall Poster (Hand Hygiene) -->
      <a-plane position="-7 2 -12.9" width="1.5" height="2" color="#FFFFFF">
          <a-plane position="0 0.8 0.01" width="1.3" height="0.2" color="#0D47A1"></a-plane>
          <a-text value="HAND HYGIENE" position="0 0.8 0.02" color="#FFFFFF" align="center" scale="0.5 0.5 0.5"></a-text>
          <a-plane position="0 0 0.01" width="1.2" height="1.2" color="#E0F2F1"></a-plane>
          <a-text value="1. Wet Hands\n2. Apply Soap\n3. Rub Hands\n4. Rinse" position="0 0 0.02" color="#000000" align="center" scale="0.4 0.4 0.4"></a-text>
      </a-plane>

      <!-- Advanced VR Locomotion Rig -->
      <a-entity id="rig" movement-controls="controls: gamepad,keyboard,touch; speed: 0.15">
        <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          <!-- Desktop Cursor (fallback) -->
          <a-entity cursor="fuse: false; rayOrigin: mouse;"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #FFFFFF; shader: flat"
                    animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
          </a-entity>
        </a-entity>
        
        <!-- Left Controller (Teleport & Smooth Movement) -->
        <a-entity oculus-touch-controls="hand: left" 
                  blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: a-plane, a-box;">
        </a-entity>
        
        <!-- Right Controller (Laser Pointer for UI and Interactions) -->
        <a-entity oculus-touch-controls="hand: right" 
                  laser-controls="hand: right" 
                  raycaster="objects: [patient-interaction], .clickable; far: 20">
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
